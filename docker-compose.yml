services:
  db:
    image: postgres:15-alpine
    container_name: compliance_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - compliance_net

  minio:
    # AD-6: S3-compatible object storage with Object Lock for retention 7 лет (Q12)
    image: minio/minio:latest
    container_name: compliance_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      # SECURITY: bind to localhost only — backend подключается через docker network
      # (http://minio:9000); host порт нужен только для отладки и admin console.
      - "127.0.0.1:9000:9000"   # API endpoint
      - "127.0.0.1:9001:9001"   # Web console
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - compliance_net

  minio-init:
    # One-shot bootstrap: bucket с object lock + scoped backend user
    image: minio/mc:latest
    container_name: compliance_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\";
      mc mb --ignore-existing --with-lock local/compliance-default;
      mc version enable local/compliance-default;
      mc admin user add local \"$$MINIO_BACKEND_USER\" \"$$MINIO_BACKEND_PASSWORD\" || true;
      mc admin policy attach local readwrite --user \"$$MINIO_BACKEND_USER\" || true;
      echo 'minio: bucket initialized with object lock + versioning; backend scoped user provisioned';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BACKEND_USER: ${MINIO_BACKEND_USER}
      MINIO_BACKEND_PASSWORD: ${MINIO_BACKEND_PASSWORD}
    networks:
      - compliance_net
    restart: "no"

  backend:
    build: ./backend
    container_name: compliance_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      # Legacy (deprecated, оставлены для backward compat — будут удалены при имплементации AD-4 в Phase 1)
      LICENSE_SERVER_URL: ${LICENSE_SERVER_URL}
      COMPANY_LICENSE_KEY: ${COMPANY_LICENSE_KEY}
      # MinIO (AD-6): scoped пользователь с readwrite policy, НЕ root
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_BACKEND_USER}
      MINIO_SECRET_KEY: ${MINIO_BACKEND_PASSWORD}
      MINIO_DEFAULT_BUCKET: compliance-default
      # Licensing (AD-4) — placeholder для Phase 1 имплементации
      LICENSE_PUBLIC_KEY_PATH: /app/license/public_key.pem
      # Master password prompt (AD-Q5) — placeholder; Phase 4+ переключит в "true"
      MASTER_PASSWORD_PROMPT_REQUIRED: "false"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    ports:
      - "8080:8000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - compliance_net

  frontend:
    build: ./frontend/apps/compliance-frontend
    container_name: compliance_frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - compliance_net

volumes:
  postgres_data:
  uploads_data:    # legacy; Phase 2+ мигрирует document-uploads в MinIO
  minio_data:

networks:
  compliance_net:
    driver: bridge
    name: compliance_net
