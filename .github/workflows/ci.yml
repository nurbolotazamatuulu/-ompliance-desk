name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches:
      - main

# Cancel in-progress runs when a new commit is pushed to the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'backend/requirements*.txt'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt

      - name: Ruff (syntax + critical errors)
        # Phase 0 lenient: select=E9,F63,F7,F82 (configured in backend/pyproject.toml)
        working-directory: backend
        run: ruff check app

      - name: Pre-create legacy hardcoded /app/uploads dirs
        # Existing routers/high_risk_countries.py:18 does
        # `os.makedirs("/app/uploads/hrc_docs")` at module-import time.
        # Container ships with /app writable; bare runner does not.
        # Phase 1 cleanup will refactor to lazy/configurable paths.
        run: |
          sudo mkdir -p /app/uploads/hrc_docs
          sudo chown -R $USER:$USER /app

      - name: Pytest smoke test
        env:
          DATABASE_URL: postgresql://test:test@localhost/test
          SECRET_KEY: test_secret_key_for_ci_only_not_used_for_signing
          LICENSE_SERVER_URL: http://test.local
          COMPANY_LICENSE_KEY: test
        working-directory: backend
        run: pytest

  frontend:
    name: Frontend (typecheck + build all workspaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies (npm ci)
        working-directory: frontend
        run: npm ci

      - name: Typecheck all workspaces
        working-directory: frontend
        run: npm run typecheck --workspaces --if-present

      - name: Build all workspaces
        working-directory: frontend
        run: npm run build --workspaces --if-present

  license-generator:
    name: License generator (CLI sanity check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'tools/license-generator/requirements.txt'

      - name: Install dependencies
        run: pip install -r tools/license-generator/requirements.txt

      - name: Generate test RSA keys (in /tmp, not in repo)
        working-directory: tools/license-generator
        run: python generate-keys.py --out-dir /tmp/test-keys

      - name: Issue test license
        working-directory: tools/license-generator
        run: |
          python generate-license.py \
            --tenant-id 1 \
            --expires 2027-12-31 \
            --sku CS+VO \
            --add-ons risk_advanced_vasp \
            --key /tmp/test-keys/private_key.pem \
            --output /tmp/test-license.jwt

      - name: Decode and verify test license
        working-directory: tools/license-generator
        run: |
          cp /tmp/test-keys/public_key.pem keys/public_key.pem
          python examples/decode-token.py --file /tmp/test-license.jwt
